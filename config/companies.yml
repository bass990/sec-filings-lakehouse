# Companies whose 10-K / 10-Q text is fetched, chunked and embedded.
# Facts (silver/gold) cover EVERY filer in the quarterly datasets; the document
# corpus is scoped to this list so a laptop can embed it in minutes.
# CIK = SEC Central Index Key (stable company id).
companies:
