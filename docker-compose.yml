# Local infrastructure for the SEC lakehouse. Everything the pipeline needs
# and nothing it does not: an S3-compatible object store, an Iceberg REST
# catalog, and Postgres with pgvector for the vector index + serving tables.
# Spark, dbt, Dagster and the API run from the Python venv on the host so a
# laptop with 16 GB can run the whole platform (~2.5 GB for these containers).
#
#   docker compose up -d          # start infra
#   make pipeline                 # run the platform end to end
#   docker compose down -v        # wipe everything

services:
  # Object store. The service keeps the name `minio` because every endpoint in the
  # stack points at http://minio:9000, but the default image is RustFS: MinIO's
  # community images (quay.io/minio/* and docker.io/minio/*) moved behind a login
  # in 2025 and answer "unauthorized" to anonymous pulls, which broke fresh clones
  # and CI. RustFS speaks the same S3 API on the same ports. To keep using an
  # already-cached MinIO image over an existing MinIO volume, set in .env:
  #   OBJECT_STORE_IMAGE=quay.io/minio/minio:latest
  #   OBJECT_STORE_COMMAND=server /data --console-address :9001
  minio:
    image: ${OBJECT_STORE_IMAGE:-rustfs/rustfs:latest}
    command: ${OBJECT_STORE_COMMAND:-rustfs}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakehouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehouse-local}
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-lakehouse}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lakehouse-local}
      RUSTFS_VOLUMES: /data
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lakehouse-local}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket ${LAKEHOUSE_BUCKET:-sec-lakehouse} 2>/dev/null ||
      aws --endpoint-url http://minio:9000 s3 mb s3://${LAKEHOUSE_BUCKET:-sec-lakehouse};
      echo bucket-ready"

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lakehouse-local}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://${LAKEHOUSE_BUCKET:-sec-lakehouse}/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8181:8181"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-lakehouse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-lakehouse-local}
      POSTGRES_DB: ${PG_DB:-lakehouse}
    ports: ["5433:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lakehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
  pg-data:
