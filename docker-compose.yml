# Local infrastructure for the SEC lakehouse. Everything the pipeline needs
# and nothing it does not: an S3-compatible object store, an Iceberg REST
# catalog, and Postgres with pgvector for the vector index + serving tables.
# Spark, dbt, Dagster and the API run from the Python venv on the host so a
# laptop with 16 GB can run the whole platform (~2.5 GB for these containers).
#
#   docker compose up -d          # start infra
#   make pipeline                 # run the platform end to end
#   docker compose down -v        # wipe everything

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakehouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehouse-local}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-lakehouse} ${MINIO_ROOT_PASSWORD:-lakehouse-local} &&
      mc mb -p local/${LAKEHOUSE_BUCKET:-sec-lakehouse} &&
      mc anonymous set none local/${LAKEHOUSE_BUCKET:-sec-lakehouse} &&
      echo bucket-ready"

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lakehouse-local}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://${LAKEHOUSE_BUCKET:-sec-lakehouse}/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8181:8181"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-lakehouse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-lakehouse-local}
      POSTGRES_DB: ${PG_DB:-lakehouse}
    ports: ["5433:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lakehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
  pg-data:
